name: Build and publish release firmware

# Triggers on tags like v1.2.7 (exactly what scripts/release.sh creates).
# Builds the tiny env and publishes the resulting firmware-tiny-v<version>.bin
# as a GitHub Release asset. That naming is required for OtaUpdater on-device
# to recognize it (see isMatchingFirmwareAssetName() in src/network/OtaUpdater.cpp).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and build dependencies
        run: |
          pip install -U platformio
          pip install -r requirements.txt

      - name: Derive version from tag
        id: version
        run: |
          # v1.2.7 -> 1.2.7
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build firmware (tiny)
        env:
          INKMOD_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e tiny

      - name: Locate built firmware asset
        id: artifact
        run: |
          FILE=".pio/build/tiny/firmware-tiny-v${{ steps.version.outputs.version }}.bin"
          if [ ! -f "$FILE" ]; then
            echo "::error::Expected artifact not found: $FILE"
            echo "Build directory contents:"
            ls -la .pio/build/tiny/
            exit 1
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload firmware
        uses: softprops/action-gh-release@v2
        with:
          name: "inkMOD ${{ github.ref_name }}"
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.path }}
